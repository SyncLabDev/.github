name: Bug Report
description: Report a reproducible issue with a SYNC Lab resource.
title: "[BUG] "
labels:
  - "type: bug"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, confirm:
        - You are using a supported version of the resource.
        - You have read the available documentation.
        - You have searched existing issues.
        - The problem is consistently reproducible.
        - You have removed all secrets from logs before pasting.

  - type: input
    id: resource
    attributes:
      label: SYNC Lab Resource
      description: Which SYNC Lab resource is affected?
      placeholder: "sync-notify"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Resource Version
      description: Which version are you running?
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - Qbox
        - QBCore
        - ESX
        - Standalone
        - Other
    validations:
      required: true

  - type: input
    id: framework_version
    attributes:
      label: Framework Version
      placeholder: "Version or commit hash"

  - type: input
    id: artifact
    attributes:
      label: FiveM Server Artifact
      description: The FiveM artifact/build number your server is running.
      placeholder: "e.g. 10000"

  - type: input
    id: database
    attributes:
      label: Database Provider
      description: Which database resource are you using?
      placeholder: "e.g. oxmysql"

  - type: textarea
    id: integrations
    attributes:
      label: Active Integrations
      description: List any optional integrations active alongside this resource.
      placeholder: |
        ox_lib, ox_inventory, ox_target, pma-voice, …

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: Clearly describe what is happening.
      placeholder: "Describe the issue in detail."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Exact steps required to reproduce the problem.
      placeholder: |
        1. Start the resource
        2. Perform the action
        3. Observe the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: errors
    attributes:
      label: Console Errors
      description: Paste relevant client, server, or NUI console errors. Remove secrets first.
      render: shell

  - type: textarea
    id: diagnostic
    attributes:
      label: Diagnostic Output
      description: |
        If the resource provides startup diagnostics or a diagnostic command, paste the output here.
        Remove tokens, webhooks, passwords, and API keys before pasting.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, videos, logs, or other useful information.

  - type: checkboxes
    id: checklist
    attributes:
      label: Acknowledgements
      options:
        - label: I am using a supported version of the resource.
          required: true
        - label: I have searched existing issues before creating this report.
          required: true
        - label: I have removed passwords, tokens, webhooks, API keys, and other secrets from all pasted output.
          required: true
        - label: I can reproduce this issue consistently.
          required: true
