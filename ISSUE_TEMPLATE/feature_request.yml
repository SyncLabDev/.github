name: Feature Request
description: Suggest an improvement or new feature for a SYNC Lab resource.
title: "[FEATURE] "
labels:
  - "type: feature"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem or limitation first, then your proposed solution.
        Feature requests focused on a real use case are more likely to be considered.

  - type: dropdown
    id: resource
    attributes:
      label: Resource
      description: Which SYNC Lab resource does this request apply to?
      options:
        - sync-notify
        - sync-textui
        - sync-hud
        - sync-chat
        - sync-loading-screen
        - sync-reports
        - sync-safezones
        - sync-employment
        - sync-character
        - Other / Not listed
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or Limitation
      description: What problem or limitation does this feature solve?
      placeholder: "Explain what is currently impossible or difficult to do."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you think the feature should work.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Real Use Case
      description: Explain how this would be used on a real FiveM server.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches you have tried.

  - type: checkboxes
    id: checklist
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and feature requests before submitting.
          required: true
        - label: This request is for a SYNC Lab resource.
          required: true
        - label: I explained a real production use case for this feature.
          required: true
