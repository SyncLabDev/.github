name: Feature Request
description: Suggest an improvement or new feature for a SYNC Lab resource.
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve SYNC Lab resources.

        Please explain the problem or limitation first, then describe your proposed solution.

  - type: input
    id: resource
    attributes:
      label: Resource
      description: Which SYNC Lab resource is this request for?
      placeholder: sync-notify
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation are you trying to solve?
      placeholder: Explain the current limitation.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you think the feature should work.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: FiveM Use Case
      description: Explain how this feature would be used on a real FiveM server.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you considered.

  - type: dropdown
    id: importance
    attributes:
      label: Importance
      options:
        - Nice to have
        - Useful
        - Important
        - Critical for my use case
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and feature requests.
          required: true
        - label: This request relates to a SYNC Lab resource.
          required: true
        - label: I explained a real use case for the requested feature.
          required: true
